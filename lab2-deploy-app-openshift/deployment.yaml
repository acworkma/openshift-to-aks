apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-sample
  labels:
    app: nextjs-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs-sample
  template:
    metadata:
      labels:
        app: nextjs-sample
    spec:
      containers:
      - name: nextjs-sample
        image: ghcr.io/acworkma/nextjs-sample:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          protocol: TCP
          name: http
        env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: sample-app-config
              key: app.message
        - name: APP_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: sample-app-config
              key: app.environment
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5

